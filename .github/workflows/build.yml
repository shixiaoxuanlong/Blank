name: Build Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Extract Latest ZIP Uploaded from Phone
        shell: bash
        run: |
          LATEST_ZIP=""
          LATEST_TS=0
          while IFS= read -r -d "" f; do
            TS=$(git log -1 --format="%ct" -- "$f" 2>/dev/null || echo 0)
            if [ "${TS:-0}" -ge "$LATEST_TS" ]; then
              LATEST_TS="${TS:-0}"
              LATEST_ZIP="$f"
            fi
          done < <(find . -maxdepth 2 -name "*.zip" -print0)

          if [ -n "$LATEST_ZIP" ]; then
            echo "检测到最新上传的工程压缩包: $LATEST_ZIP ，正在云端自动覆盖解压..."
            unzip -o "$LATEST_ZIP" -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          elif [ -f "AndroidImageCompressor/settings.gradle.kts" ]; then
            cd AndroidImageCompressor
            gradle assembleDebug --no-daemon --stacktrace
          else
            echo "未找到 settings.gradle.kts，请确保已上传 AndroidImageCompressor.zip 或完整工程文件"
            exit 1
          fi

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageCompressor-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
